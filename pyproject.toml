[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dtf-net-core"
version = "0.1.0"
description = "Partial public release of the DTF-Net fusion core for underwater-to-air restoration"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["torch>=2.6", "numpy>=1.23", "Pillow>=9.0"]

[tool.setuptools.packages.find]
include = ["dtf_net*"]
